<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS · NEURAL</title>
<style>
  :root {
    --fond: #04070a;
    --texte: #9fb6c0;
    --texte-faible: #4c626d;
    --vous: #6fe3ff;
    --jarvis: #ffb23e;
    --mono: "Consolas", "SF Mono", "Menlo", "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--fond);
    color: var(--texte);
    font-family: var(--mono);
  }

  /* Halo radial tres sombre derriere le reacteur. */
  #scene {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 46%, rgba(20,60,80,0.10), transparent 55%),
      radial-gradient(circle at 50% 120%, rgba(10,30,45,0.25), transparent 60%),
      var(--fond);
  }

  #reacteur {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(72vmin, 640px);
    height: min(72vmin, 640px);
  }

  /* --- releve d'etat, en haut a gauche --- */
  .releve {
    position: fixed;
    top: 34px; left: 40px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 2.1;
    color: var(--texte-faible);
    user-select: none;
  }
  .releve .champ { display: flex; gap: 12px; align-items: center; }
  .releve .cle { width: 74px; color: var(--texte-faible); }
  .releve .val { color: var(--texte); }
  .releve .val.actif { color: var(--vous); text-shadow: 0 0 10px rgba(111,227,255,0.5); }

  /* petite pastille systeme */
  .pastille {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #d24b4b;
    box-shadow: 0 0 8px #d24b4b;
  }
  .pastille.enligne { background: #52e0a0; box-shadow: 0 0 8px #52e0a0; }

  /* jauge de niveau */
  .jauge {
    width: 120px; height: 6px;
    border: 1px solid rgba(120,150,165,0.35);
    position: relative;
    overflow: hidden;
  }
  .jauge > i {
    position: absolute; inset: 0;
    width: 0%;
    background: linear-gradient(90deg, rgba(111,227,255,0.2), var(--vous));
    box-shadow: 0 0 12px rgba(111,227,255,0.6);
    transition: width 0.08s linear;
  }

  /* --- horloge, en haut a droite --- */
  .horloge {
    position: fixed;
    top: 30px; right: 42px;
    text-align: right;
    user-select: none;
  }
  .horloge .heure {
    font-size: 30px;
    letter-spacing: 6px;
    color: var(--texte);
    text-shadow: 0 0 14px rgba(120,180,200,0.25);
  }
  .horloge .date {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--texte-faible);
    margin-top: 6px;
  }

  /* Menu de liens locaux, cache : rien ne signale qu'il est cliquable (pas de
     curseur, pas de soulignement) -- s'ouvre sous la date, uniquement pour
     qui sait qu'il est la. */
  #menuLiens {
    position: fixed;
    top: 96px; right: 42px;
    display: none;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
    z-index: 20;
  }
  #menuLiens.ouvert { display: flex; }
  #menuLiens a {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texte-faible);
    text-decoration: none;
    opacity: .55;
  }
  #menuLiens a:hover { color: var(--vous); opacity: 1; }

  /* --- etiquette d'etat sous le reacteur --- */
  .etiquette-etat {
    position: fixed;
    left: 50%;
    top: calc(50% + min(38vmin, 340px));
    transform: translate(-50%, -50%);
    font-size: 13px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--vous);
    text-shadow: 0 0 16px currentColor;
    user-select: none;
    transition: color 0.4s ease;
  }

  /* --- transcription, en bas --- */
  .transcription {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    width: min(760px, 84vw);
    max-height: 210px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 34%);
            mask-image: linear-gradient(180deg, transparent, #000 34%);
  }
  .ligne {
    font-size: 13.5px;
    letter-spacing: 0.4px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(6px);
    animation: entree 0.35s ease forwards;
  }
  @keyframes entree { to { opacity: 1; transform: none; } }

  .ligne .qui {
    font-size: 9.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--texte-faible);
    display: block;
    margin-bottom: 1px;
  }
  .ligne.vous { text-align: left; color: var(--vous); }
  .ligne.vous .qui { color: rgba(111,227,255,0.55); }
  .ligne.jarvis { text-align: right; color: var(--jarvis); }
  .ligne.jarvis .qui { color: rgba(255,178,62,0.55); }
  .ligne.outil {
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texte-faible);
  }
  .ligne.outil b { color: #8aa2ad; font-weight: 600; }

  /* --- equerres de coin facon HUD --- */
  .coin {
    position: fixed;
    width: 26px; height: 26px;
    border: 2px solid rgba(120,160,180,0.35);
    pointer-events: none;
  }
  .coin.hg { top: 20px; left: 22px; border-right: none; border-bottom: none; }
  .coin.hd { top: 20px; right: 22px; border-left: none; border-bottom: none; }
  .coin.bg { bottom: 20px; left: 22px; border-right: none; border-top: none; }
  .coin.bd { bottom: 20px; right: 22px; border-left: none; border-top: none; }

  .astuce {
    position: fixed;
    bottom: 30px; left: 42px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texte-faible);
    user-select: none;
  }

  /* --- panneau agents (taches dispatch_agent), en bas a droite --- */
  .agents-panneau {
    position: fixed;
    bottom: 30px; right: 42px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-align: right;
    color: var(--texte-faible);
    user-select: none;
    max-width: 260px;
  }
  .agents-panneau .titre {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 10px;
    margin-bottom: 6px;
  }
  /* Point d'etat permanent : rouge = aucun agent actif, vert = au moins un
     agent en_cours. Visible en permanence (pas seulement quand la liste a des
     entrees), a cote du titre "Agents". */
  .agents-panneau .indicateur {
    display: inline-block;
    width: 7px; height: 7px;
    margin-left: 7px;
    border-radius: 50%;
    background: #ff6b6b;
    box-shadow: 0 0 5px rgba(255,107,107,0.6);
    transition: background 0.25s, box-shadow 0.25s;
    vertical-align: middle;
  }
  .agents-panneau .indicateur.actif {
    background: #52e0a0;
    box-shadow: 0 0 9px rgba(82,224,160,0.9);
  }
  .agents-panneau .ligne-agent {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 10px;
    line-height: 1.9;
  }
  .agents-panneau .ligne-agent .nom {
    color: var(--texte);
    max-width: 170px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agents-panneau .ligne-agent .statut {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    flex: none;
  }
  .agents-panneau .ligne-agent.en-cours .statut {
    color: #52e0a0;
    text-shadow: 0 0 8px rgba(82,224,160,0.6);
  }
  .agents-panneau .ligne-agent.termine .statut { color: var(--texte); }
  .agents-panneau .ligne-agent.erreur .statut { color: #ff6b6b; text-shadow: 0 0 8px rgba(255,107,107,0.5); }

  /* Reaction du visuel neural pendant qu'au moins un agent travaille : pulsation
     verte purement CSS (aucune modification de la boucle de dessin JS). Rouge/
     inerte par defaut des qu'aucun agent n'est en_cours (classe retiree). */
  #reacteur.agents-actifs {
    animation: pulseAgents 1.6s ease-in-out infinite;
  }
  @keyframes pulseAgents {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(82,224,160,0)); }
    50% { filter: drop-shadow(0 0 24px rgba(82,224,160,0.55)); }
  }

  /* --- panneau memoire (core/memoire.py), sous le releve en haut a gauche --- */
  .memoire-panneau {
    position: fixed;
    top: 230px; left: 40px;
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--texte-faible);
    user-select: none;
    max-width: 280px;
  }
  .memoire-panneau .titre {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 10px;
    margin-bottom: 6px;
  }
  .memoire-panneau .resume { margin-bottom: 4px; }
  .memoire-panneau .fait {
    color: var(--texte);
    line-height: 1.7;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 280px;
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <canvas id="reacteur"></canvas>

  <div class="etiquette-etat" id="etiquetteEtat">VEILLE</div>

  <div class="releve">
    <div class="champ"><span class="cle">Systeme</span>
      <span class="val"><span class="pastille" id="pastille"></span>
      <span id="vSysteme">Hors ligne</span></span></div>
    <div class="champ"><span class="cle">Modele</span>
      <span class="val" id="vModele">—</span></div>
    <div class="champ"><span class="cle">Ecoute</span>
      <span class="val" id="vEcoute">—</span></div>
    <div class="champ"><span class="cle">Niveau</span>
      <span class="jauge"><i id="vJauge"></i></span></div>
    <div class="champ"><span class="cle">Routage</span>
      <span class="val" id="vRoutage">—</span></div>
    <div class="champ"><span class="cle">Budget</span>
      <span class="val" id="vBudget">—</span></div>
    <div class="champ"><span class="cle">Hermes</span>
      <span class="val" id="vHermes">—</span></div>
  </div>

  <div id="bandeauConfirm" style="display:none;position:fixed;top:64px;left:50%;
    transform:translateX(-50%);padding:8px 18px;border-radius:10px;z-index:9;
    background:rgba(245,185,66,.14);border:1px solid rgba(245,185,66,.5);
    color:#f5b942;font-size:14px;letter-spacing:.05em">⏳ En attente de confirmation…</div>
  <div id="badgeMuet" style="display:none;position:fixed;top:16px;right:16px;z-index:9;
    padding:5px 12px;border-radius:999px;background:rgba(255,107,107,.16);
    border:1px solid rgba(255,107,107,.5);color:#ff8a8a;font-size:12px">🔇 Micro coupé</div>
  <div id="badgeDemo" style="display:none;position:fixed;top:16px;left:16px;z-index:9;
    padding:5px 12px;border-radius:8px;background:rgba(245,185,66,.16);
    border:1px solid rgba(245,185,66,.6);color:#f5b942;font-size:12px;letter-spacing:.1em">
    DÉMO — rien n'est réel</div>

  <div class="horloge">
    <div class="heure" id="vHeure">--:--:--</div>
    <div class="date" id="vDate" onclick="basculerMenuLiens(event)">—</div>
  </div>
  <div id="menuLiens">
    <a href="http://localhost:8790/chat" target="_blank" rel="noopener">chat</a>
    <a href="http://localhost:8790/panneau" target="_blank" rel="noopener">panneau</a>
    <a href="http://localhost:8790/cockpit" target="_blank" rel="noopener">cockpit</a>
  </div>

  <div class="transcription" id="transcription"></div>

  <div class="coin hg"></div>
  <div class="coin hd"></div>
  <div class="coin bg"></div>
  <div class="coin bd"></div>

  <div class="astuce" id="astuce"></div>

  <div class="agents-panneau" id="agentsPanel">
    <div class="titre" onclick="basculerMenuLiens(event)">Agents<span class="indicateur" id="agentsIndicateur"></span></div>
    <div id="agentsListe"></div>
  </div>

  <div class="memoire-panneau" id="memoirePanel" style="display:none">
    <div class="titre">Memoire</div>
    <div class="resume" id="memoireResume"></div>
    <div id="memoireFaits"></div>
  </div>

<script>
"use strict";

// ------------------------------------------------------------- etat courant

const S = {
  etat: "veille",
  niveauCible: 0,
  niveauLisse: 0,
  modele: "—",
  stt: "—",
  enligne: false,
  visuel: "neural",   // mode "reacteur" desactive pour le moment (toggle V retire)
  routage: "—",
  budget: null,
  hermes: null,
  muet: false,
  connu: null,
};

// Taches dispatch_agent (core/agents.py) : id -> {nom, statut, detail}.
// Map separee de S (pas une simple valeur courante mais un journal borne).
const AGENTS = new Map();
const AGENTS_MAX = 6;   // lignes affichees dans le panneau (les plus recentes)

// Sous-systemes reels de Jarvis (core/ et tools/), pas de jargon neuro
// invente : chaque cluster s'allume quand un outil de sa famille tourne.
// La correspondance mot-cle -> cluster est une heuristique sur le nom
// d'outil recu via l'evenement "outil" ; a affiner quand le vrai registre
// d'outils (core/registre.py) sera branche sur le HUD.
const CLUSTERS = [
  { id: "voix",         nom: "VOIX",         mots: ["voix", "tts", "parle", "dis_"],
    teinte: "111,227,255" },
  { id: "memoire",      nom: "MEMOIRE",      mots: ["memoire", "souvenir", "note", "journal", "rappelle"],
    teinte: "180,140,255" },
  { id: "personnalite", nom: "PERSONNALITE", mots: ["personnalite", "humeur"],
    teinte: "255,120,190" },
  { id: "reseau",       nom: "RESEAU",       mots: ["mail", "web", "discord", "instagram", "meteo", "navigateur", "appel"],
    teinte: "120,220,150" },
  { id: "agenda",       nom: "AGENDA",       mots: ["heure", "date", "agenda", "rappel", "reservation", "brief", "stats", "temps"],
    teinte: "255,196,90" },
  { id: "maison",       nom: "MAISON",       mots: ["lumiere", "couleur", "luminosite", "maison"],
    teinte: "255,110,90" },
  { id: "systeme",      nom: "SYSTEME",      mots: [],  // repli si aucun mot-cle ne correspond
    teinte: "150,170,185" },
];

function clusterPour(nomOutil) {
  const n = String(nomOutil || "").toLowerCase();
  for (const c of CLUSTERS) {
    if (c.mots.some((m) => n.includes(m))) return c;
  }
  return CLUSTERS[CLUSTERS.length - 1];  // SYSTEME par defaut
}

function declencherFlash(nomOutil) {
  clusterPour(nomOutil).flash = 1;
}

// Etoiles de fond : positions fixes en fractions du canvas, pas de cout
// de recalcul au redimensionnement.
const ETOILES = Array.from({ length: 70 }, () => ({
  fx: Math.random(), fy: Math.random(),
  r: 0.4 + Math.random() * 1.1,
  ph: Math.random() * Math.PI * 2,
}));

const LIBELLES = {
  veille: "VEILLE",
  ecoute: "ECOUTE",
  reflexion: "REFLEXION",
  parole: "PAROLE",
  muet: "MICRO COUPE",
};

// Couleur dominante par etat : cyan sourd, cyan vif, bleu-violet, ambre.
const COULEURS = {
  veille:    { r: 42,  g: 112, b: 130 },
  ecoute:    { r: 46,  g: 224, b: 255 },
  reflexion: { r: 138, g: 108, b: 255 },
  parole:    { r: 255, g: 176, b: 62  },
  muet:      { r: 255, g: 107, b: 107 },
};

let couleur = Object.assign({}, COULEURS.veille);  // couleur affichee, lissee

// ------------------------------------------------------------- utilitaires

const $ = (id) => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;

function versCouleur(cible, t) {
  couleur.r = lerp(couleur.r, cible.r, t);
  couleur.g = lerp(couleur.g, cible.g, t);
  couleur.b = lerp(couleur.b, cible.b, t);
}
function rgba(a) {
  return `rgba(${couleur.r|0},${couleur.g|0},${couleur.b|0},${a})`;
}

function arrondi(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ------------------------------------------------------------- canvas

const canvas = $("reacteur");
const ctx = canvas.getContext("2d");
let L = 0, H = 0;

function redimensionner() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  L = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.round(L * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  genererClusters();
}
window.addEventListener("resize", redimensionner);

// Repositionne les clusters et regenere leurs noeuds pour la taille de
// canvas courante. Pas de cout : quelques centaines de points, une fois
// par redimensionnement (pas par frame).
function genererClusters() {
  const echelle = Math.min(L, H);
  const Rc = echelle * 0.27;
  CLUSTERS.forEach((c, i) => {
    const a = (-90 + i * (360 / CLUSTERS.length)) * Math.PI / 180;
    c.angleBase = a;          // angle de repos ; la rotation globale s'ajoute au rendu
    c.rayon = Rc;
    c.angle = a;               // conserve pour compat
    c.cx = Math.cos(a) * Rc;   // position de repos (non utilisee directement au rendu neural)
    c.cy = Math.sin(a) * Rc;
    if (c.flash === undefined) c.flash = 0;
    c.respPhase = Math.random() * Math.PI * 2;      // respiration du halo, independante du niveau
    c.respVitesse = 0.0005 + Math.random() * 0.0004;
    c.ligPhase = Math.random() * Math.PI * 2;        // pulsation du fil coeur -> cluster
    c.noeuds = [];
    const n = 14 + Math.floor(Math.random() * 6);
    for (let k = 0; k < n; k++) {
      const rr = Math.random() * echelle * 0.085;
      const aa = Math.random() * Math.PI * 2;
      c.noeuds.push({
        ox: Math.cos(aa) * rr, oy: Math.sin(aa) * rr,   // base statique (compat)
        orbiteR: rr, orbiteA: aa,
        orbite: (Math.random() < 0.5 ? -1 : 1) * (0.00007 + Math.random() * 0.00013),
        amp: echelle * (0.012 + Math.random() * 0.02),
        vitesse: 0.4 + Math.random() * 0.9,
        ph: Math.random() * Math.PI * 2,
        ph2: Math.random() * Math.PI * 2,
        r: 1 + Math.random() * 1.6,
      });
    }
    c.filaments = Array.from({ length: 3 + Math.floor(Math.random() * 3) }, () => ({
      a: Math.random() * Math.PI * 2,
      longueur: echelle * (0.06 + Math.random() * 0.08),
      vitesse: 0.15 + Math.random() * 0.3,
      decalage: Math.random(),
      ph: Math.random() * Math.PI * 2,
      rot: (Math.random() < 0.5 ? -1 : 1) * (0.00001 + Math.random() * 0.00002),
    }));
  });
}

const NB_BOBINES = 10;
const NB_TICKS = 72;

function dessinerReacteur(t) {
  const niv = S.niveauLisse;

  ctx.clearRect(0, 0, L, H);
  const cx = L / 2, cy = H / 2;
  const R = Math.min(L, H) * 0.46;

  const respire = 0.5 + 0.5 * Math.sin(t * 0.0018);   // pulsation lente
  const rotTicks = t * 0.00018;
  const rotBobines = -t * 0.00007;
  const rotTriangle = t * 0.00011;

  ctx.lineCap = "round";

  // --- halo exterieur diffus ---
  const halo = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.15);
  halo.addColorStop(0, rgba(0.10 + niv * 0.10));
  halo.addColorStop(1, rgba(0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.15, 0, Math.PI * 2);
  ctx.fill();

  // --- anneaux concentriques ---
  const anneaux = [1.0, 0.9, 0.62, 0.4];
  anneaux.forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(i === 0 ? 0.35 : 0.22);
    ctx.lineWidth = i === 0 ? 2 : 1.2;
    ctx.stroke();
  });

  // --- reticule de graduations qui tourne ---
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotTicks);
  for (let i = 0; i < NB_TICKS; i++) {
    const a = (i / NB_TICKS) * Math.PI * 2;
    const longue = (i % 6 === 0);
    const r1 = R * 0.78;
    const r2 = r1 + (longue ? 14 : 7);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.strokeStyle = rgba(longue ? 0.7 : 0.28);
    ctx.lineWidth = longue ? 1.8 : 1;
    ctx.stroke();
  }
  ctx.restore();

  // --- couronne de dix bobines ---
  const rc = R * 0.52;
  const bw = R * 0.13, bh = R * 0.2;
  for (let i = 0; i < NB_BOBINES; i++) {
    const a = (i / NB_BOBINES) * Math.PI * 2 + rotBobines;
    const x = cx + Math.cos(a) * rc;
    const y = cy + Math.sin(a) * rc;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI / 2);
    arrondi(ctx, -bw / 2, -bh / 2, bw, bh, 4);
    ctx.fillStyle = rgba(0.08);
    ctx.fill();
    ctx.strokeStyle = rgba(0.6);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // trait lumineux au coeur de la bobine
    ctx.beginPath();
    ctx.moveTo(0, -bh * 0.28);
    ctx.lineTo(0, bh * 0.28);
    ctx.strokeStyle = rgba(0.5 + 0.4 * respire);
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.restore();
  }

  // --- triangle central ---
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotTriangle);
  const rt = R * 0.34;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
    const x = Math.cos(a) * rt, y = Math.sin(a) * rt;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = rgba(0.55);
  ctx.lineWidth = 2;
  ctx.shadowColor = rgba(0.7);
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 0;

  // --- coeur lumineux en degrade radial, enfle avec le niveau ---
  const coeurR = R * (0.16 + niv * 0.17 + respire * 0.015);
  const rayon = coeurR * 2.4;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rayon);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.22, rgba(0.95));
  g.addColorStop(0.55, rgba(0.32));
  g.addColorStop(1, rgba(0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, rayon, 0, Math.PI * 2);
  ctx.fill();

  // point blanc central
  ctx.beginPath();
  ctx.arc(cx, cy, coeurR * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fill();
}

// --- mode "neural" : reseau de particules par sous-systeme -------------
//
// Meme idee que le reacteur (etat courant -> couleur, niveau micro ->
// pulsation) mais rendue comme un graphe de clusters labellises. Pas de
// ctx.filter (blur plein-canvas par frame) : c'est catastrophique sans
// compositing GPU du canvas 2D (mesure ailleurs : 30s+ pour une seule
// frame floutee). Le flou vient uniquement de degrades radiaux, qui sont
// bon marche meme en rendu logiciel.
function dessinerNeural(t) {
  const niv = S.niveauLisse;
  const cx = L / 2, cy = H / 2;
  const echelle = Math.min(L, H);
  const respire = 0.5 + 0.5 * Math.sin(t * 0.0018);
  const rotConstellation = t * 0.00005;  // rotation lente et continue de toute la constellation

  ctx.clearRect(0, 0, L, H);

  // etoiles
  for (const e of ETOILES) {
    const alpha = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t * 0.001 + e.ph));
    ctx.beginPath();
    ctx.arc(e.fx * L, e.fy * H, e.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
    ctx.fill();
  }

  // positions live des clusters : la constellation entiere tourne lentement
  // autour du coeur (pas juste les noeuds internes qui derivent).
  for (const c of CLUSTERS) {
    const angle = c.angleBase + rotConstellation;
    c.ccx = cx + Math.cos(angle) * c.rayon;
    c.ccy = cy + Math.sin(angle) * c.rayon;
    c.angleLive = angle;
  }

  // fils reliant le coeur a chaque cluster, avec pulsation d'opacite/epaisseur
  for (const c of CLUSTERS) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.0014 + c.ligPhase);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(c.ccx, c.ccy);
    ctx.strokeStyle = `rgba(${c.teinte},${(0.06 + pulse * 0.12 + c.flash * 0.3).toFixed(3)})`;
    ctx.lineWidth = 1 + pulse * 0.8 + c.flash * 1.2;
    ctx.stroke();
  }

  for (const c of CLUSTERS) {
    c.flash *= 0.94;  // decroissance du flash d'activite
    const ccx = c.ccx, ccy = c.ccy;
    // respiration du halo, independante du niveau micro : vit meme au silence total
    const respirCluster = 0.5 + 0.5 * Math.sin(t * c.respVitesse + c.respPhase);
    const intensite = 0.45 + niv * 0.3 + c.flash * 0.7 + respirCluster * 0.3;

    // halo du cluster
    const rHalo = echelle * (0.1 + respirCluster * 0.03);
    const halo = ctx.createRadialGradient(ccx, ccy, 0, ccx, ccy, rHalo);
    halo.addColorStop(0, `rgba(${c.teinte},${(0.14 * intensite).toFixed(3)})`);
    halo.addColorStop(1, `rgba(${c.teinte},0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(ccx, ccy, rHalo, 0, Math.PI * 2);
    ctx.fill();

    // filaments sortants (plus nombreux), derive d'orientation lente,
    // opacite qui respire, etincelle qui voyage
    for (const f of c.filaments) {
      const fa = f.a + t * f.rot;
      const fx = ccx + Math.cos(fa) * f.longueur;
      const fy = ccy + Math.sin(fa) * f.longueur;
      const filPulse = 0.5 + 0.5 * Math.sin(t * 0.002 + f.ph);
      ctx.beginPath();
      ctx.moveTo(ccx, ccy);
      ctx.lineTo(fx, fy);
      ctx.strokeStyle = `rgba(${c.teinte},${(0.08 + filPulse * 0.1 + c.flash * 0.3).toFixed(3)})`;
      ctx.stroke();

      const prog = (t * 0.00005 * f.vitesse + f.decalage) % 1;
      const sx = ccx + (fx - ccx) * prog, sy = ccy + (fy - ccy) * prog;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${c.teinte},0.8)`;
      ctx.fill();
    }

    // derive orbitale + ondulation des noeuds : plus organique et plus ample
    // qu'un simple sin/cos de faible amplitude. Positions calculees une fois,
    // reutilisees pour les aretes et pour le dessin des points.
    const noeuds = c.noeuds;
    const pos = noeuds.map((n) => {
      const ang = n.orbiteA + t * n.orbite;
      const bx = Math.cos(ang) * n.orbiteR, by = Math.sin(ang) * n.orbiteR;
      const wx = Math.sin(t * 0.0006 * n.vitesse + n.ph) * n.amp;
      const wy = Math.cos(t * 0.0005 * n.vitesse + n.ph2) * n.amp;
      return { x: ccx + bx + wx, y: ccy + by + wy };
    });

    // aretes entre noeuds proches (sur les positions animees)
    ctx.strokeStyle = `rgba(${c.teinte},0.22)`;
    ctx.lineWidth = 1;
    for (let i = 0; i < pos.length; i++) {
      for (let j = i + 1; j < pos.length; j++) {
        const dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
        const d = Math.hypot(dx, dy);
        if (d < echelle * 0.05) {
          ctx.beginPath();
          ctx.moveTo(pos[i].x, pos[i].y);
          ctx.lineTo(pos[j].x, pos[j].y);
          ctx.stroke();
        }
      }
    }

    // noeuds
    for (let k = 0; k < noeuds.length; k++) {
      const n = noeuds[k], p = pos[k];
      ctx.beginPath();
      ctx.arc(p.x, p.y, n.r * (1 + c.flash * 0.6), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${c.teinte},${(0.55 + c.flash * 0.4).toFixed(3)})`;
      ctx.fill();
    }

    // etiquette : suit la position live du cluster (constellation en rotation)
    const lx = cx + Math.cos(c.angleLive) * c.rayon * 1.42;
    const ly = cy + Math.sin(c.angleLive) * c.rayon * 1.42;
    ctx.font = "11px Consolas, monospace";
    ctx.textAlign = Math.cos(c.angleLive) >= 0 ? "left" : "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = `rgba(${c.teinte},${(0.75 + c.flash * 0.25).toFixed(3)})`;
    ctx.fillText(c.nom, lx, ly);
  }

  // coeur central, meme logique de pulsation que le reacteur
  const coeurR = echelle * (0.05 + niv * 0.05 + respire * 0.008);
  const rayon = coeurR * 3;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rayon);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.25, rgba(0.9));
  g.addColorStop(0.6, rgba(0.28));
  g.addColorStop(1, rgba(0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, rayon, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, coeurR * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.fill();
}

// --- boucle d'affichage : lisse etat/niveau une fois, puis delegue au
// rendu actif (reacteur ou neural) --------------------------------------
function boucle(t) {
  requestAnimationFrame(boucle);
  versCouleur(COULEURS[S.etat] || COULEURS.veille, 0.05);
  S.niveauLisse += (S.niveauCible - S.niveauLisse) * 0.15;
  if (S.visuel === "neural") dessinerNeural(t); else dessinerReacteur(t);
}

// ------------------------------------------------------------- interface

function fmtBudget(b) {
  if (!b) return "—";
  let s = (Number(b.cout) || 0).toFixed(2) + "$";
  if (b.plafond) s += " / " + b.plafond + "$ (" + Math.round((b.pct || 0) * 100) + "%)";
  return s;
}
function fmtHermes(h) {
  if (!h) return "—";
  const p = [];
  if (h.taches > 0) p.push(h.taches + " tache" + (h.taches > 1 ? "s" : "") + " en cours");
  if (h.tokens != null) p.push(Number(h.tokens).toLocaleString("fr-FR") + " tok/30j");
  return p.length ? p.join(" · ") : "au repos";
}

function majReleve() {
  $("vModele").textContent = S.modele || "—";
  $("vEcoute").textContent = S.stt || "—";
  $("vSysteme").textContent = S.enligne ? "En ligne" : "Hors ligne";
  $("pastille").classList.toggle("enligne", S.enligne);
  $("vRoutage").textContent = S.routage || "—";
  $("vBudget").textContent = fmtBudget(S.budget);
  $("vHermes").textContent = fmtHermes(S.hermes);
  $("badgeMuet").style.display = S.muet ? "block" : "none";
  // budget proche/au plafond : la ligne vire à l'ambre puis au rouge.
  const pct = S.budget && S.budget.plafond ? (S.budget.pct || 0) : 0;
  $("vBudget").style.color = pct >= 1 ? "#ff6b6b" : (pct >= 0.8 ? "#f5b942" : "");

  const et = LIBELLES[S.etat] || S.etat.toUpperCase();
  const eti = $("etiquetteEtat");
  eti.textContent = et;
  const c = COULEURS[S.etat] || COULEURS.veille;
  eti.style.color = `rgb(${c.r},${c.g},${c.b})`;

  // La valeur "ecoute" s'illumine quand on est en ecoute active.
  $("vEcoute").classList.toggle("actif", S.etat === "ecoute");
}

const LIB_STATUT = { en_cours: "en cours", termine: "termine", erreur: "erreur" };
function majAgents() {
  const lignes = [...AGENTS.values()].slice(-AGENTS_MAX);
  const actif = [...AGENTS.values()].some((a) => a.statut === "en_cours");

  // Indicateur permanent (vert = au moins un agent actif, rouge = aucun) et
  // reaction du visuel neural : les deux suivent le meme etat, independamment
  // de la liste (visible meme si aucun agent n'a jamais tourne).
  $("agentsIndicateur").classList.toggle("actif", actif);
  $("reacteur").classList.toggle("agents-actifs", actif);

  $("agentsListe").innerHTML = lignes.map((a) => {
    const cls = a.statut === "en_cours" ? "en-cours" : a.statut;
    const lib = LIB_STATUT[a.statut] || a.statut;
    return `<div class="ligne-agent ${cls}"><span class="nom">${echap(a.nom)}</span>` +
           `<span class="statut">${echap(lib)}</span></div>`;
  }).join("");
}

function majMemoire() {
  const m = S.connu;
  const panneau = $("memoirePanel");
  if (!m) { panneau.style.display = "none"; return; }
  const nbPrefs = Object.keys(m.preferences || {}).length;
  const nbGens = Object.keys(m.people || {}).length;
  const nbProjets = Object.keys(m.projects || {}).length;
  const faits = (m.facts || []).slice(-4);
  if (!nbPrefs && !nbGens && !nbProjets && !faits.length) {
    panneau.style.display = "none";
    return;
  }
  panneau.style.display = "block";
  $("memoireResume").textContent =
    `${nbPrefs} pref. · ${nbGens} pers. · ${nbProjets} projet${nbProjets > 1 ? "s" : ""}`;
  $("memoireFaits").innerHTML = faits
    .map((f) => `<div class="fait">${echap(f)}</div>`)
    .join("");
}

function majNiveau() {
  $("vJauge").style.width = Math.round(S.niveauLisse * 100) + "%";
  requestAnimationFrame(majNiveau);
}

// transcription : on empile les lignes, on garde les dernieres.
const fluxTexte = $("transcription");
function ajouterLigne(html, classe) {
  const div = document.createElement("div");
  div.className = "ligne " + classe;
  div.innerHTML = html;
  fluxTexte.appendChild(div);
  while (fluxTexte.children.length > 14) {
    fluxTexte.removeChild(fluxTexte.firstChild);
  }
}
function echap(s) {
  return String(s).replace(/[&<>]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// ------------------------------------------------------------- horloge

const JOURS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi",
               "Vendredi", "Samedi"];
const MOIS = ["Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin", "Juillet",
              "Aout", "Septembre", "Octobre", "Novembre", "Decembre"];
function majHorloge() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  $("vHeure").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  $("vDate").textContent =
    `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
}

// Menu de liens locaux (chat/panneau/cockpit), cache derriere un clic sur la
// date ou sur "Agents" -- aucun indice visuel qu'il existe. Ouvre en nouvel
// onglet pour que le HUD reste actif. Se ferme UNIQUEMENT en recliquant sur
// la date ou Agents (pas au clic ailleurs, pour eviter les fermetures
// surprise si on clique par erreur sur le fond).
function basculerMenuLiens(ev) {
  ev.stopPropagation();
  $("menuLiens").classList.toggle("ouvert");
}

// ------------------------------------------------------------- evenements

function appliquer(ev) {
  switch (ev.t) {
    case "etat":
      S.etat = ev.v;
      majReleve();
      break;
    case "niveau":
      S.niveauCible = ev.v;
      break;
    case "config":
      S.modele = ev.modele;
      S.stt = ev.stt;
      majReleve();
      break;
    case "vous":
      ajouterLigne(`<span class="qui">Vous</span>${echap(ev.texte)}`, "vous");
      break;
    case "jarvis":
      ajouterLigne(`<span class="qui">Jarvis</span>${echap(ev.texte)}`, "jarvis");
      break;
    case "outil":
      ajouterLigne(
        `⚙ <b>${echap(ev.nom)}</b>${ev.detail ? " · " + echap(ev.detail) : ""}`,
        "outil");
      declencherFlash(ev.nom);
      break;
    case "routage":
      S.routage = ev.v;
      majReleve();
      break;
    case "budget":
      S.budget = { cout: ev.cout, plafond: ev.plafond, pct: ev.pct };
      majReleve();
      break;
    case "hermes":
      S.hermes = { taches: ev.taches, tokens: ev.tokens };
      majReleve();
      break;
    case "agent":
      AGENTS.set(ev.id, { nom: ev.nom, statut: ev.statut, detail: ev.detail });
      majAgents();
      break;
    case "confirmation":
      $("bandeauConfirm").style.display = ev.v ? "block" : "none";
      break;
    case "micro":
      S.muet = ev.v;
      majReleve();
      break;
    case "demo":
      $("badgeDemo").style.display = ev.v ? "block" : "none";
      break;
    case "connu":
      S.connu = { preferences: ev.preferences, people: ev.people,
                  projects: ev.projects, facts: ev.facts };
      majMemoire();
      break;
  }
}

// ------------------------------------------------------------- connexion SSE

function connecter() {
  let source;
  try {
    source = new EventSource("/flux");
  } catch (e) {
    S.enligne = false; majReleve();
    return;
  }
  source.onopen = () => { S.enligne = true; majReleve(); };
  source.onmessage = (e) => {
    try { appliquer(JSON.parse(e.data)); } catch (err) {}
  };
  source.onerror = () => {
    // EventSource se reconnecte tout seul ; on marque juste hors ligne.
    S.enligne = false; majReleve();
  };
}

// ------------------------------------------------------------- demonstration

// Rejoue un scenario cote page, pour voir le rendu sans serveur quand la
// page est ouverte directement (file://).
function demonstration() {
  S.enligne = true;
  appliquer({ t: "config", modele: "qwen2.5:7b (demo)", stt: "whisper medium" });

  const tours = [
    ["allume la lumiere de la chambre", "allumer_lumiere", "chambre -> on",
     "C'est fait, la chambre est allumee."],
    ["mets le salon en bleu", "changer_couleur", "salon -> bleu",
     "Voila, le salon passe en bleu."],
    ["quelle heure est-il", "heure_et_date", "",
     "Il est vingt-deux heures dix."],
  ];

  let i = 0, minuteurNiveau = 0;
  function bruit(base, amp, vitesse) {
    clearInterval(minuteurNiveau);
    let k = 0;
    minuteurNiveau = setInterval(() => {
      k++;
      S.niveauCible = Math.max(0, base + amp * Math.abs(Math.sin(k * vitesse)));
    }, 50);
  }

  function tour() {
    const [q, outilNom, detail, rep] = tours[i % tours.length];
    i++;
    appliquer({ t: "etat", v: "veille" });
    bruit(0.05, 0.03, 0.15);
    setTimeout(() => {
      appliquer({ t: "etat", v: "ecoute" });
      appliquer({ t: "vous", texte: q });
      bruit(0.4, 0.35, 0.4);
    }, 1400);
    setTimeout(() => {
      appliquer({ t: "etat", v: "reflexion" });
      bruit(0.05, 0.02, 0.2);
      if (outilNom) appliquer({ t: "outil", nom: outilNom, detail: detail });
    }, 3600);
    setTimeout(() => {
      appliquer({ t: "etat", v: "parole" });
      appliquer({ t: "jarvis", texte: rep });
      bruit(0.3, 0.25, 0.6);
    }, 4700);
    setTimeout(() => { S.niveauCible = 0.05; tour(); }, 7200);
  }
  tour();
}

// ------------------------------------------------------------- demarrage

function majAstuce() {
  // Plus de toggle de visuel (reacteur desactive) : rien a afficher pour l'instant.
}

// Toggle "V" (neural <-> reacteur) desactive pour le moment -- on ne garde
// que le mode neural, a retravailler.

redimensionner();
majHorloge();
majReleve();
majAgents();
majAstuce();
setInterval(majHorloge, 1000);
requestAnimationFrame(boucle);
requestAnimationFrame(majNiveau);

if (location.protocol === "file:") {
  demonstration();
} else {
  connecter();
}
